services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Integration tests resolve domain ports from the container; the aliases are private in
  # prod and would be pruned while no controller consumes them yet.
  App\Experience\Domain\ExperienceRepository:
    alias: App\Experience\Infrastructure\Persistence\Doctrine\DoctrineExperienceRepository
    public: true

  App\Session\Domain\SessionRepository:
    alias: App\Session\Infrastructure\Persistence\Doctrine\DoctrineSessionRepository
    public: true

  App\Shared\Domain\Clock:
    alias: App\Shared\Infrastructure\SystemClock
    public: true
