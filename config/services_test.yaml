services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Integration tests resolve domain ports from the container; the aliases are private in
  # prod and would be pruned while no controller consumes them yet.
  App\Experience\Domain\ExperienceRepository:
    alias: App\Experience\Infrastructure\Persistence\Doctrine\DoctrineExperienceRepository
    public: true

  App\Session\Domain\SessionRepository:
    alias: App\Session\Infrastructure\Persistence\Doctrine\DoctrineSessionRepository
    public: true

  App\Booking\Domain\BookingRepository:
    alias: App\Booking\Infrastructure\Persistence\Doctrine\DoctrineBookingRepository
    public: true

  App\Booking\Domain\BookingReferenceGenerator:
    alias: App\Booking\Infrastructure\Reference\RandomBookingReferenceGenerator
    public: true

  App\Shared\Domain\Clock:
    alias: App\Shared\Infrastructure\SystemClock
    public: true

  App\Booking\Domain\Notification\SentNotificationRegistry:
    alias: App\Booking\Infrastructure\Persistence\Doctrine\DbalSentNotificationRegistry
    public: true

  # The functional test asserts on what was actually "sent"; the in-memory double captures it
  # instead of building a real Symfony\Component\Mime\Email through MAILER_DSN=null://null.
  App\Tests\Doubles\Booking\InMemoryMailer:
    public: true

  App\Booking\Domain\Notification\MailerPort: '@App\Tests\Doubles\Booking\InMemoryMailer'

  # Only the outbox-atomicity integration test needs this: it builds a real doctrine:// transport
  # directly (the suite otherwise runs Messenger on sync://, which never touches messenger_messages).
  Symfony\Component\Messenger\Bridge\Doctrine\Transport\DoctrineTransportFactory:
    alias: messenger.transport.doctrine.factory
    public: true
