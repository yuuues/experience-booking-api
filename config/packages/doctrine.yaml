doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    types:
      experience_id: App\Experience\Infrastructure\Persistence\Doctrine\Type\ExperienceIdType
      provider_id: App\Experience\Infrastructure\Persistence\Doctrine\Type\ProviderIdType
      experience_title: App\Experience\Infrastructure\Persistence\Doctrine\Type\TitleType
      experience_description: App\Experience\Infrastructure\Persistence\Doctrine\Type\DescriptionType
  orm:
    enable_native_lazy_objects: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    controller_resolver:
      auto_mapping: false
    mappings:
      Shared:
        type: xml
        dir: '%kernel.project_dir%/config/doctrine/Shared'
        prefix: 'App\Shared\Domain'
        is_bundle: false
      Experience:
        type: xml
        dir: '%kernel.project_dir%/config/doctrine/Experience'
        prefix: 'App\Experience\Domain'
        is_bundle: false
      Session:
        type: xml
        dir: '%kernel.project_dir%/config/doctrine/Session'
        prefix: 'App\Session\Domain'
        is_bundle: false
      Booking:
        type: xml
        dir: '%kernel.project_dir%/config/doctrine/Booking'
        prefix: 'App\Booking\Domain'
        is_bundle: false

when@test:
  doctrine:
    dbal:
      dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
  doctrine:
    orm:
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool
  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system
